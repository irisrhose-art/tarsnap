name: Fabrica Deep Check

on:
  workflow_dispatch:

jobs:
  asan:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake autoconf-archive pkg-config make clang libssl-dev zlib1g-dev e2fslibs-dev libbz2-dev liblzma-dev
      - name: Configure ASan
        env:
          CC: clang
          CFLAGS: -O1 -g -fsanitize=address -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address
        run: |
          autoreconf -i
          ./configure
      - name: Build ASan
        env:
          CC: clang
          CFLAGS: -O1 -g -fsanitize=address -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address
        run: make -j2
      - name: Test ASan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: make test VERBOSE=1
      - name: Upload ASan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-test-output
          path: tests-output
          if-no-files-found: warn

  ubsan:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake autoconf-archive pkg-config make clang libssl-dev zlib1g-dev e2fslibs-dev libbz2-dev liblzma-dev
      - name: Configure UBSan
        env:
          CC: clang
          CFLAGS: -O1 -g -fsanitize=undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=undefined
        run: |
          autoreconf -i
          ./configure
      - name: Build UBSan
        env:
          CC: clang
          CFLAGS: -O1 -g -fsanitize=undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=undefined
        run: make -j2
      - name: Test UBSan and keep diagnostics
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: make test VERBOSE=1
      - name: Upload UBSan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubsan-test-output
          path: tests-output
          if-no-files-found: warn
